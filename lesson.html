    <li><b>Cell Reference</b> : គឺជាការកំណត់លក្ខណៈរបស់ Cells</li>
    <li>Cell Reference មាន 2 ប្រភេទ :
      <ul>
        <li><b>Relative Cell Reference</b></li>
        <li><b>Absolute Cell Reference</b></li>
      </ul>
    </li>
    <li><b>Relative Cell Reference</b> : Cell អាចផ្លាស់ប្ដូរទីតាំងបាន</li>
    <li>ឧទាហរណ៍ : =A1+B1 → Copy ទៅ C2 នឹងក្លាយជា =A2+B2</li>
    <li><b>Absolute Cell Reference</b> : Cell មិនអាចផ្លាស់ប្ដូរទីតាំងបាន</li>
    <li>ប្រើសញ្ញា $ ដើម្បីថេរទីតាំង</li>
    <li>ឧទាហរណ៍ : =$A$1+$B$1</li>
    <li><b>############</b> : តម្លៃលើសពីទំហំ Cell</li>
    <li><b>#DIV/0!</b> : ចែកលេខដោយ 0</li>
    <li><b>#N/A</b> : Function មិនអាចរកទិន្នន័យ</li>
    <li><b>#Name?</b> : Formula មានអក្សរមិនត្រឹមត្រូវ</li>
    <li><b>#Null!</b> : Cell Reference ខុស</li>
    <li><b>#Num!</b> : ទិន្នន័យលេខខុស</li>
    <li><b>#Ref!</b> : Reference មិនត្រឹមត្រូវ</li>
    <li><b>#VALUE!</b> : ប្រើទិន្នន័យខុសប្រភេទ</li>
  </ul>
  `

  module: 5,
  task: 1,
  title: "Introduction to Programming",
  page: 86,
  summary: `
  <ul>
    <li><b>What is a Program?</b>
      <ul>
        <li>Program គឺជា "សំណុំនៃការណែនាំ" សម្រាប់បញ្ជាឱ្យកុំព្យូទ័រធ្វើការងារអ្វីមួយតាមលំដាប់លំដោយ</li>
        
      </ul>
    </li>

    <li><b>Program Formula</b>
      <ul>
        <li>រូបមន្តសាមញ្ញ៖ Program = Algorithm (លំដាប់លំដោយ) + Command (ពាក្យបញ្ជា)</li>
      </ul>
    </li>

    <li><b>Steps to Create a Program</b>
      <ol>
        <li>Define the Problem – កំណត់បញ្ហា ឬគោលដៅ</li>
        <li>Design the Algorithm – រចនាអាល់ហ្គូរីសិន</li>
        <li>Create Flowchart – បង្កើត Flowchart (អាចមាន ឬមិនមាន)</li>
        <li>Write the Code – សរសេរកូដ</li>
        <li>Test the Program – សាកល្បង និងបញ្ចូលទិន្នន័យ</li>
        <li>Debug & Improve – កែតម្រូវ Bug និងលើកកម្ពស់កម្មវិធី</li>
        <li>Save & Share – រក្សាទុក និងចែកចាយ</li>
      </ol>
    </li>

    <li><b>What is an Algorithm?</b>
      <ul>
        <li>Algorithm: គឺជា "ជំហានដោះស្រាយបញ្ហា"</li>
        <li>ប្រើសម្រាប់ដោះស្រាយបញ្ហា ឬបំពេញភារកិច្ចមួយ</li>
      </ul>
    </li>

    <li><b>Flowchart</b>
      <ul>
        <li>Flowchart គឺជារាងក្រាហ្វិក (Diagram)ឬរូបភាពបង្ហាញពីជំហាន" នៃ Algorithm ដើម្បីឱ្យងាយមើលយល់</li>
        <li>ប្រើសម្រាប់បង្ហាញលំហូរនៃដំណើរការកម្មវិធីតាមជំហានៗ</li>
      </ul>
    </li>
  </ul>
  `
},

  <li><b>Tight</b>: អត្ថបទព័ទ្ធជុំវិញរូបភាពតាមរាងរបស់រូបភាព (បើប្អូនប្រើរូបភាពគ្មាន Background វានឹងព័ទ្ធតាមរាងរូបនោះតែម្ដង)។</li>
  <li><b>Behind Text</b>: ដាក់រូបភាពនៅពីក្រោយអត្ថបទ (ដូចជាផ្ទៃ Background)។</li>
  <li><b>In Front of Text</b>: ដាក់រូបភាពនៅពីមុខអត្ថបទ (បាំងអក្សរ តែងាយស្រួលរំកិលបំផុត)។</li>
  <li><b>Top and Bottom</b>: អត្ថបទនៅខាងលើ និងខាងក្រោមរូបភាព (គ្មានអត្ថបទនៅសងខាងរូបភាពឡើយ)។</li>
</ul>
  </ul>
  `

    <li><b>កម្មវិធី Web Browser ដែលពេញនិយម</b>
      <ul>
        <li>Google Chrome</li>
        <li>Microsoft Edge</li>
        <li>Safari</li>
        <li>Mozilla Firefox</li>
      </ul>
    </li>

    <li><b>Website Search Engine ដែលពេញនិយម</b>
      <ul>
        <li>www.bing.com (Microsoft)</li>
        <li>www.google.com (Google)</li>
      </ul>
    </li>

    <li><b>Refresh (F5)</b> : ប្រើសម្រាប់ដំណើរការ Webpage ថ្មីឡើងវិញ ដើម្បីមើលព័ត៌មានថ្មី</li>
    <li><b>Esc / Stop</b> : ប្រើសម្រាប់បញ្ឈប់ដំណើរការ Loading នៅលើ Web Page</li>
  </ul>

  <p><b>ពាក្យកាត់សំខាន់ៗដែលត្រូវស្វែងយល់</b></p>
  <ul>
    <li><b>URL</b> (Uniform Resource Locator) គឺជាអាសយដ្ឋានពេញលេញរបស់វេបសាយមួយ (ឧទាហរណ៍៖ https://www.google.com)។</li>
    <li>ក្រុមដែលជា Protocol</li>
    <li>Protocol គឺជាច្បាប់ ឬបទដ្ឋានសម្រាប់ធ្វើការទាក់ទងគ្នារវាងកុំព្យូទ័រ និងកុំព្យូទ័រតាមអ៊ីនធឺណិត</li>
    <ul>
    <li><b>IP</b> (Internet Protocol)សម្រាប់កំណត់អាសយដ្ឋានម៉ាស៊ីនក្នុងបណ្ដាញ</li>
    <li><b>HTTP</b> (Hypertext Transfer Protocol) សម្រាប់ផ្ទេរទិន្នន័យវេបសាយ (អត្ថបទ រូបភាព)</li>
    <li><b>HTTPS</b> (Hypertext Transfer Protocol Secure)ដូច HTTP ដែរ តែវាមានសុវត្ថិភាពខ្ពស់ជាង (មានការ encryption ការពារទិន្នន័យ)</li>
    <li><b>FTP</b> (File Transfer Protocol) សម្រាប់ផ្ញើ ឬទទួលឯកសារ (Files) រវាងកុំព្យូទ័រ និង Server</li>
    </ul>
    <li><b>Domain Extensions</b></li>
    <ul>
    <li><b>COM</b> (Commercial)សម្រាប់ក្រុមហ៊ុន ឬអាជីវកម្ម</li>
    <li><b>EDU</b> (Education)សម្រាប់សាលារៀន ឬគ្រឹះស្ថានអប់រំ</li>
    <li><b>ORG</b> (Organization) សម្រាប់អង្គការ ឬសមាគមមិនរកប្រាក់ចំណេញ</li>
    </ul>
  </ul>
  `

    <li>
      <b>Wiki​(វិគី)</b>:គឺជាប្រភេទគេហទំព័រមួយដែលអនុញ្ញាតឱ្យអ្នកប្រើប្រាស់ទូទៅអាច បង្កើត កែសម្រួល និងលុប

      <li>ភាពងាយស្រួល (Convenience): អ្នកមិនចាំបាច់ចេះសរសេរកូដស្មុគស្មាញដើម្បីកែប្រែព័ត៌មាននោះទេ។</li>

      <li>ការភ្ជាប់ទំនាក់ទំនង (Hyperlinking): ងាយស្រួលក្នុងការបង្កើតតំណភ្ជាប់ (Link) ពីទំព័រមួយទៅទំព័រមួយទៀត។</li>

    </li>

  summary: `
  <ul>
    <li>
      <b>Malware</b> :
      គឺជាបណ្ដុំកម្មវិធីដែលត្រូវបានបង្កើតឡើង
      ដើម្បីលួចយកទិន្នន័យ ឬបង្អាក់ប្រព័ន្ធប្រតិបត្តិការរបស់ Computer។
    </li>

    <li>
      <b>ប្រភេទ Malware</b> :
      Trojan Horse, Worm, Spyware, Adware និង Ransomware។
    </li>

    <li>
      <b>Trojan Horse</b> :
      ជាប្រភេទ Virus មួយដែលលាក់ខ្លួននៅក្នុង Software ស្របច្បាប់
      ដែល Hacker បង្កើតឡើង ដើម្បី Access ចូល Computer របស់យើង។
    </li>

    <li>
      <b>Worm</b> :
      ជាប្រភេទ Virus ដែលអាចចម្លងខ្លួនឯងដោយស្វ័យប្រវត្ត
      និងរាលដាលទៅ Computer ផ្សេងៗតាម Network។
    </li>

    <li>
      <b>Spyware</b> :
      ជាប្រភេទ Virus សម្រាប់តាមដាន និងប្រមូលព័ត៌មានសំខាន់ៗ
      របស់អ្នកប្រើប្រាស់ Internet ដោយមិនឱ្យដឹងមុន។
    </li>

    <li>
      <b>Adware</b> :
      កម្មវិធីផ្ទាំងពាណិជ្ជកម្មដែលរំខាន។មេរោគនេះអាចឆ្លងចូលបានតាមរយៈកម្មវិធី Free និង គេហទំព័រមិនសុវត្ថិភាព។
    </li>

    <li>
      <b>Spam / Junk Mail</b> :
      ជាសារដែលផ្ញើមកច្រើនដងក្នុងពេលតែមួយ
      ហើយភាគច្រើនមាន Link Website។
    </li>

    <li>
      <b>Phishing Mail</b> :
      ជាសារដែលព្យាយាមលួចយកព័ត៌មានសំខាន់ៗ
      ដូចជា Username, Password និង Credit Card Numbers។
    </li>

    <li>
      <b>Chain Mail / Chain Letter</b> :
      ជាសារដែលបញ្ចុះបញ្ចូលឱ្យ User Copy និង Send បន្តទៅអ្នកដទៃ។
    </li>

    <li>
      <b>Firewall</b> :
      ជាប្រព័ន្ធសុវត្ថិភាពដែលជួយទប់ស្កាត់ការវាយប្រហារតាម Network។
    </li>

    <li>
      <b>Padlock</b> :
      ជាសញ្ញាសម្គាល់ថា Website មានសុវត្ថិភាពខ្ពស់ (HTTPS)។
    </li>

    <li>
      <b>សំណួរសម្រាប់ពិភាក្សា</b>
      <ul>
        <li>Internet ផ្ដល់អត្ថប្រយោជន៍អ្វីខ្លះដល់អ្នកប្រើប្រាស់?</li>
        <li>តើគេបង្កើត Virus ឡើងមកដើម្បីអ្វី?</li>
        <li>តើ Calendar នៅក្នុង Outlook បង្កើតឡើងដើម្បីអ្វី?</li>
      </ul>
    </li>
  </ul>
  `

  summary: `
  <ul>
    <li>
      <b>Operators (និមិត្តសញ្ញាសម្រាប់គណនា)</b>
      <ul>
        <li><b>+</b> (Add) : ប្រើសម្រាប់រកផលបូក</li>
        <li><b>-</b> (Subtract) : ប្រើសម្រាប់រកផលដក</li>
        <li><b>*</b> (Multiply) : ប្រើសម្រាប់រកផលគុណ</li>
        <li><b>/</b> (Divide) : ប្រើសម្រាប់រកផលចែក</li>
      </ul>
    </li>

    <li><b>Autofill Tool</b>: ប្រើសម្រាប់បំពេញទិន្នន័យ លេខរៀង កាលបរិច្ឆេទ ឬរូបមន្តដោយស្វ័យប្រវត្តិ</li>

    <li>
      <b>Functions សំខាន់ៗក្នុង Excel</b>
      <ul>
        <li>
          <b>MIN()</b> :
          សម្រាប់រកតម្លៃតូចបំផុត<br>
          <code>=MIN(CellAddress:CellAddress)</code>
        </li>

        <li>
          <b>MAX()</b> :
          សម្រាប់រកតម្លៃធំបំផុត<br>
          <code>=MAX(CellAddress:CellAddress)</code>
        </li>

        <li>
          <b>AVERAGE()</b> :
          សម្រាប់រកតម្លៃមធ្យម<br>
          <code>=AVERAGE(CellAddress:CellAddress)</code>
        </li>

        <li>
          <b>SUM()</b> :
          សម្រាប់បូកសរុបទិន្នន័យ<br>
          <code>=SUM(CellAddress:CellAddress)</code>
        </li>
      </ul>
    </li>

    <li>
      <b>Cell Address</b> :
      ជាជួរ Cell ដែលត្រូវ Select ដើម្បីយកមកគណនា។
    </li>

    <li>
      <b>RANK()</b> :
      ជារូបមន្តប្រើសម្រាប់រកចំណាត់ថ្នាក់
      <ul>
        <li><b>Number</b> : លេខដែលត្រូវដាក់ចំណាត់ថ្នាក់</li>
        <li><b>Ref</b> : ជួរលេខដែលយកមកប្រៀបធៀប</li>
        <li><b>[Order]</b> : មិនត្រូវបានយកមកប្រើទេ</li>
      </ul>
    </li>
  </ul>
  `

  {
  module: 3,
  task: 4,
  title: "Logical Function",
  page: 92,
  summary: `
  <ul>
    <li>
      <b>IF Function</b> :
      ជារូបមន្តប្រើសម្រាប់ផ្ទៀងផ្ទាត់លក្ខខណ្ឌថា ពិត ឬ មិនពិត
      ដើម្បីទទួលបានលទ្ធផល។
    </li>

    <li>
      <b>Syntax</b> :
      <code>IF(Logical_Test, Value_If_True, Value_If_False)</code>
    </li>
    <ul>
  <li><b>ឧទាហរណ៍៖ ឧបមាថាប្អូនមានពិន្ទុសិស្សនៅក្នុង Cell A2 ហើយប្អូនចង់កំណត់ថា</b> ការបញ្ជាក់លទ្ធផលប្រឡង (Pass/Fail)</li>
  <li><b>លក្ខខណ្ឌ៖</b>
    <ul>
      <li>បើពិន្ទុចាប់ពី 50 ឡើងទៅ ឱ្យចេញពាក្យថា <b>"Pass"</b> (ជាប់)</li>
      <li>បើពិន្ទុតិចជាង 50 ឱ្យចេញពាក្យថា <b>"Fail"</b> (ធ្លាក់)</li>
    </ul>
  </li>
  <li><b>រូបមន្ត៖</b> <code>=IF(A2>=50, "Pass", "Fail")</code></li>
</ul>
    <li>
      <b>Logical_Test</b> :
      លក្ខខណ្ឌបញ្ចូល ឬការប្រៀបធៀបជាមួយតម្លៃណាមួយ។
    </li>

    <li>
      <b>Value_If_True</b> :
      តម្លៃត្រឡប់មកវិញ បើសិនលក្ខខណ្ឌពិត។
    </li>

    <li>
      <b>Value_If_False</b> :

  <ul>
    <li>
      <b>1. ការត្រៀមខ្លួន និងគោលដៅ (Planning & Goals)</b>
      <ul>
        <li><b>Time is Precious (ពេលវេលាមានតម្លៃ)</b> : ធ្វើបទបង្ហាញឱ្យខ្លី, ខ្លឹម និងចំចំណុច មិនអូសបន្លាយ។</li>
        <li><b>Define Your Purpose (កំណត់គោលបំណង)</b> : ដើម្បីដឹងច្បាស់ថា តើយើងចង់ឱ្យអ្នកស្ដាប់ទទួលបានអ្វីបន្ទាប់ពីចប់បទបង្ហាញ (ឧទាហរណ៍ ផ្ដល់ចំណេះដឹង ឬបញ្ចុះបញ្ចូល)។</li>
        <li><b>Know Your Audience (ស្គាល់អ្នកស្ដាប់)</b> : រៀបចំខ្លឹមសារ និងពាក្យសម្តីឱ្យសមស្របទៅនឹងកម្រិតយល់ដឹង និងចំណាប់អារម្មណ៍របស់អ្នកស្ដាប់ (សិស្ស, គ្រូ, អាណាព្យាបាល…)។</li>
      </ul>
    </li>

    <li>
      <b>2. ការរៀបចំខ្លឹមសារ និងបរិយាកាស (Preparation)</b>
      <ul>
        <li><b>Keep Your Presentation Lively (ធ្វើឱ្យមានភាពរស់រវើក)</b> : ទាក់ទាញអ្នកស្ដាប់ កុំឱ្យធុញទ្រាន់ តាមរយៈសំនួរ, និទានរឿងខ្លី, ឬរូបភាពប្លែកៗ។</li>
        <li><b>Check the Presentation Room (ពិនិត្យបន្ទប់)</b> : ដើម្បីបង្ការបញ្ហាបច្ចេកទេស ពិនិត្យកុំព្យូទ័រ, Projector និងសំឡេង មុនចាប់ផ្តើម។</li>
        <li><b>Preparing Your Presentation (ការរៀបចំបទបង្ហាញ)</b> : រៀបចំ Slides ជាលំដាប់ ចាប់ពីចំណងជើង, សេចក្តីផ្ដើម រហូតដល់សេចក្តីសន្និដ្ឋាន។</li>
      </ul>
    </li>

    <li>
      <b>3. បច្ចេកទេសរចនាស្លាយ (Design Skills)</b>
      <ul>
        <li><b>Use Simple Color (ប្រើពណ៌សាមញ្ញ)</b> : អ្នកស្ដាប់ងាយស្រួលមើល និងមិនឈឺភ្នែក។ ប្រើពណ៌ផ្ទុយគ្នា (អក្សរខ្មៅលើផ្ទៃស) និងកុំប្រើពណ៌ច្រើនពេក។</li>
      </ul>
    </li>
  </ul>
  `

      ចូលទៅក្នុងក្រឡាតែមួយ 
    </li>

    <li>

    </li>

    <ul>
  <li><b>Auto Fill</b> : ប្រើសម្រាប់បំពេញទិន្នន័យ(ដូចជាលេខរៀង កាលបរិច្ឆេទ) និងសម្រាប់ចម្លងរូបមន្ត ឬអត្ថបទដោយស្វ័យប្រវត្តិ</li>

    <li>
      <b>LEFT, RIGHT, MID</b> : រូបមន្តសម្រាប់ដកស្រង់អក្សរ
      ឬតួលេខ (Text) ចេញពីក្នុង Cell
      <ul>

          <br>Syntax: =LEFT(text, num_chars)
        </li>
        <li>

        </li>

        </li>
      </ul>
    </li>

    <li>

      <ul>
        <li><b>Logical_test</b> : លក្ខខណ្ឌដែលត្រូវផ្ទៀងផ្ទាត់</li>
        <li><b>Value_if_true</b> : លទ្ធផលបើ Logical_test ពិត</li>
        <li><b>Value_if_false</b> : លទ្ធផលបើ Logical_test មិនពិត</li>
      </ul>
    </li>

    <li>
      <b>AND</b> : រូបមន្តសម្រាប់រកលក្ខខណ្ឌ
      ដែលត្រូវពិតទាំងអស់ ទើបទទួលបានលទ្ធផលត្រឹមត្រូវ
      <ul>
        <li>
          ឧទាហរណ៍៖ លក្ខខណ្ឌដើម្បីជាប់អាហារូបករណ៍
          គឺសិស្សត្រូវមាន “ពិន្ទុលើស ៩០” AND “អវត្តមានសូន្យ”
        </li>
        <li>ពិន្ទុ ៩៥ តែអវត្តមាន ១ ថ្ងៃ → FALSE (មិនជាប់)</li>
        <li>ពិន្ទុ ៩៥ ហើយអវត្តមាន ០ ថ្ងៃ → TRUE (ជាប់)</li>
      </ul>
    </li>

    <li>
      <b>OR</b> : រូបមន្តសម្រាប់រកលក្ខខណ្ឌច្រើន
      បើមានលក្ខខណ្ឌមួយពិត ក៏ទទួលបានលទ្ធផល
      <ul>
        <li>
          ឧទាហរណ៍៖ លក្ខខណ្ឌដើម្បីបានការបញ្ចុះតម្លៃ
          គឺអ្នកជា “សិស្ស” OR “អ្នកមានបណ្ណសមាជិក”
        </li>
        <li>ជាសិស្ស តែគ្មានបណ្ណ → TRUE (បានចុះតម្លៃ)</li>
        <li>មិនមែនសិស្ស និងគ្មានបណ្ណ → FALSE (មិនបានចុះតម្លៃ)</li>
      </ul>
    </li>

    <li>
      <b>COUNTIF</b>
      <ul>
        <li>Syntax: =COUNTIF(range, criteria)</li>
        <li><b>Range</b> : ជាលំដាប់ទិន្នន័យសម្រាប់ផ្ទៀងផ្ទាត់</li>
        <li><b>Criteria</b> : ជាលក្ខខណ្ឌដែលត្រូវរាប់</li>
      </ul>
    </li>
  </ul>
  `

  "summary": `
  <ul>
    <li>
      <b>What is Database?</b>
    </li>

    <li>
      <b>Data (ទិន្នន័យ)</b> :
      គឺជាប្រភេទព័ត៌មាន (Information) នៅជុំវិញខ្លួនយើង។
      <br>
      <b>ឧទាហរណ៍</b> : Name, ID, Gender, Place of Birth...
    </li>

    <li>
      <b>Information (ព័ត៌មាន)</b> :
      គឺជាការពិត ឬព័ត៌មានលម្អិត។
      <br>
      <b>ឧទាហរណ៍</b> : ចំនួនសិស្ស ៦នាក់, ភេទប្រុស ៦នាក់...
    </li>

    <li>
      <b>Database (មូលដ្ឋានទិន្នន័យ)</b> :
      គឺជាប្រព័ន្ធសម្រាប់រៀបចំ និងគ្រប់គ្រងទិន្នន័យ។
      វាដូចជាឃ្លាំងឌីជីថលដ៏ធំមួយសម្រាប់រក្សាទុកព័ត៌មាន។
    </li>

    <li>
      <b>Field (វាល)</b> = <b>Column (ជួរឈរ)</b> :
      ជាប្រភេទព័ត៌មានដែលអ្នកចង់ប្រមូល
      ជាគ្រោងឆ្អឹង ឬក្បាលនៃតារាង។
    </li>

    <li>
      <b>Record (សំណុំ)</b> = <b>Row (ជួរដេក)</b> :
      ជាព័ត៌មានពេញលេញសម្រាប់មនុស្សម្នាក់
      ឬវត្ថុមួយ។
    </li>

    <li>
      <b>Format as a Table (កំណត់ទម្រង់ជាតារាង)</b> :
      ជាមុខងារមួយដែលជួយរៀបចំទិន្នន័យឱ្យមានសណ្តាប់ធ្នាប់
      និងបន្ថែមមុខងារដូចជា
      <b>Sort (តម្រៀប)</b> និង <b>Filter (ត្រង)</b>
      ដោយស្វ័យប្រវត្តិ។
    </li>
  </ul>
  `

    <li>

      តាមរយៈ Fields ដោយប្រើ

      និង <b>Foreign Key</b> ក្នុង Table ផ្សេង។
    </li>

    <li>
      <b>Table Relationships</b> :
      គឺជាការភ្ជាប់តារាងពីរ ឬច្រើន
      នៅក្នុង Database
      ដើម្បីអាចទាញយកទិន្នន័យ
      ពីតារាងទាំងនោះក្នុងពេលតែមួយ។
    </li>

    <li>
      <b>ប្រភេទ Relationship មាន ៣ ប្រភេទ</b> :
      <ol>
        <li>One to One (មួយ ទៅ មួយ)</li>
        <ul>
          <li>ឧទាហរណ៍៖ មនុស្សម្នាក់ និង អត្តសញ្ញាណប័ណ្ណ។</li>
          <li>មនុស្សម្នាក់ មានអត្តសញ្ញាណប័ណ្ណតែមួយ។</li>
          <li>អត្តសញ្ញាណប័ណ្ណមួយ សម្គាល់មនុស្សបានតែម្នាក់។</li>
          </ul>
        <li>One to Many (មួយ ទៅ ច្រើន)</li>
        <ul>

  <ul>
    <li>
      <b>Infographics</b> :
      គឺជាការបង្ហាញទិន្នន័យ
      ព័ត៌មាន ឬចំណេះដឹង
      ជាលក្ខណៈរូបភាព។
      វាផ្សំបញ្ចូលគ្នារវាង
      រូបភាព និងអត្ថបទ
      ដើម្បីបញ្ជូនសារជាក់លាក់ណាមួយ
      ឱ្យបានឆាប់រហ័ស។
    </li>

    <li>
      <b>Informational / List (បញ្ជីព័ត៌មាន)</b> :
      វាមានអត្ថបទជាចម្បង
      ដែលរាយបញ្ជីព័ត៌មាន
      អំពីប្រធានបទជាក់លាក់ណាមួយ។
    </li>

    <li>
      <b>Mixed Chart (តារាងចម្រុះ)</b> :
      មានតារាងផ្សេងៗគ្នាជាច្រើន
      ដើម្បីតំណាងឱ្យទិន្នន័យ។
    </li>

    <li>
      <b>Single Chart (តារាងតែមួយ)</b> :
      ជា Infographics
      ដែលបង្ហាញទិន្នន័យ
      លើប្រធានបទតែមួយ។
    </li>

    <li>
      <b>Map / Location (ផែនទី / ទីតាំង)</b> :
      វាបង្ហាញព័ត៌មាន
      ទាក់ទងនឹងតំបន់ភូមិសាស្ត្រ។
    </li>

    <li>
      <b>Photo-based / Photo-graphic</b> :
      វាប្រើរូបថត
      អត្ថបទ និងទិន្នន័យ
      ដើម្បីពន្យល់ពីចំណុចណាមួយ។
    </li>

    <li>
      <b>Hierarchical (ឋានានុក្រម)</b> :
      វាបែងចែកព័ត៌មាន
      តាមកម្រិត
      ដូចជា កម្រិតសារៈសំខាន់
      ភាពលំបាក
      ឬប្រាក់ចំណូល។
    </li>

    <li>
      <b>Anatomical (កាយវិភាគសាស្ត្រ)</b> :

      ជាលក្ខណៈរូបភាព
      និងមានប្រសិទ្ធភាព។
    </li>
  </ul>
  `

          ឬជាកម្មវិធី
          ដែលត្រួតពិនិត្យសុវត្ថិភាព
          និងគ្រប់គ្រងចរាចរណ៍ទិន្នន័យ
          ចូល និងចេញ
          នៅលើបណ្តាញ Network។
        </li>
      </ul>
    </li>

    <li><b>Local Area Network (LAN)</b>
      <ul>
        <li>
          LAN គឺជាបង្គុំនៃ PCs
          ដែលមានទំនាក់ទំនងគ្នា
          តាមរយៈការបញ្ជូន Data
          និងការចែករំលែកប្រព័ន្ធទំនាក់ទំនង Data។
        </li>
        <li>
          LAN ផ្តល់ល្បឿនខ្ពស់
          ក្នុងការផ្លាស់ប្តូរ Data
          រវាង Server, Peripheral Devices
          និង PCs។
        </li>
        <li>
          LAN ជាទូទៅស្ថិតនៅក្នុង
          ភូមិសាស្ត្រតែមួយ
          អគារតែមួយ
          ឬ Department មួយ
          ដែលមានចម្ងាយមិនលើសពី 100 ម៉ែត្រ។
        </li>
      </ul>
    </li>

    <li><b>Wide Area Network (WAN)</b>
      <ul>
        <li>
          WAN គឺជាបង្គុំរវាង LAN និង LAN
          ឬ LAN និង MAN
          ដើម្បីធ្វើការផ្លាស់ប្តូរ
          ព័ត៌មានគ្នាទៅវិញទៅមក
          នៅចម្ងាយឆ្ងាយ។
        </li>
        <li>
          ឧទាហរណ៍:
          ពីរដ្ឋមួយទៅរដ្ឋមួយ
          ពីខេត្តមួយទៅខេត្តមួយ
          ឬពីប្រទេសមួយទៅប្រទេសមួយ។
        </li>
      </ul>
    </li>

    <li><b>TCP/IP</b>
      <ul>
        <li>
          TCP/IP (Transmission Control Protocol / Internet Protocol)
          គឺជាមូលដ្ឋានភាសាទំនាក់ទំនង
          ឬប្រូតូកូល
          របស់អ៊ីនធឺណិត។
        </li>
        <li>
          វាអាចប្រើសម្រាប់
          Network ឯកជន
          ដូចជា Intranet និង Extranet។
        </li>
        <li>
          TCP/IP គឺជាស្រទាប់ប្រូតូកូល
          ដែលមិនប្រើទាំងអស់
          លើស្រទាប់ OSI។
        </li>
      </ul>
    </li>

    <li><b>ប្រូតូកូល Network សំខាន់ៗ</b>
      <ul>
        <li>FTP – File Transfer Protocol</li>
        <li>SMTP – Simple Mail Transfer Protocol</li>
        <li>HTTP – HyperText Transfer Protocol</li>
        <li>HTTPS – HyperText Transfer Protocol Secure</li>
        <li>DNS – Domain Name System</li>
        <li>IP – Internet Protocol</li>
        <li>TCP – Transmission Control Protocol</li>
        <li>UDP – User Datagram Protocol</li>
      </ul>
    </li>
  </ul>
  `

  "title": "Networking Basics",
  "page": 66,
  "summary": `
  <ol>
    <li>
      <b>Computer Network (បណ្តាញកុំព្យូទ័រ)</b>
      <p>Network គឺជាការតភ្ជាប់ម៉ាស៊ីនកុំព្យូទ័រជាច្រើន និងឧបករណ៍ផ្សេងៗនៅលើបណ្តាញតែមួយ ដើម្បីផ្លាស់ប្តូរ Files, Voice, Video, E-mail, Print និងធនធានផ្សេងៗទៀត។</p>
    </li>

    <li>
      <b>Network Topologies (រូបរាងបណ្តាញ)</b>
      <p>ជារបៀបភ្ជាប់ម៉ាស៊ីនកុំព្យូទ័រ និងឧបករណ៍ផ្សេងៗចូលគ្នា ដោយគិតគូរពីចម្ងាយ ភាពងាយស្រួល និងសុវត្ថិភាពនៃទិន្នន័យ។</p>
    </li>

    <li>
      <b>Client-Server Model (គំរូម៉ាស៊ីនមេ និងម៉ាស៊ីនកូន)</b>
      <ul>
        <li><b>Server</b>: គឺជាម៉ាស៊ីនមេ ដែលមានតួនាទីទទួល និងឆ្លើយតបទៅតាមតម្រូវការរបស់ Client។</li>
        <li><b>Client</b>: គឺជាម៉ាស៊ីនកូន ដែលមានសមត្ថភាពអាចស្នើសុំ (Request) ធនធាន ឬសេវាកម្មផ្សេងៗពី Server។</li>
      </ul>
    </li>

    <li>
      <b>Types of Networks (ប្រភេទនៃបណ្តាញ)</b>
      <ul>
        <li><b>PAN (Personal Area Network)</b>: បណ្តាញផ្ទាល់ខ្លួនតូចបំផុត ប្រើសម្រាប់មនុស្សម្នាក់ (ដូចជាការភ្ជាប់ទូរស័ព្ទទៅកាសប៊្លូធូស)</li>
        <li><b>LAN (Local Area Network)</b>: បណ្តាញក្នុងទីកន្លែងជិតៗគ្នា ដូចជាក្នុងផ្ទះ ការិយាល័យ ឬសាលារៀន</li>
        <li><b>MAN (Metropolitan Area Network)</b>: បណ្តាញភូមិសាស្ត្រធំទូលាយ ដែលភ្ជាប់បណ្តាញ LAN ច្រើនបញ្ចូលគ្នា (ដូចជាបណ្តាញក្នុងក្រុងមួយ)</li>
        <li><b>WAN (Wide Area Network)</b>: ភ្ជាប់តាមរយៈក្រុមហ៊ុន ISP នៅតំបន់ឆ្ងាយៗ ឬប្រទេសផ្សេងៗជុំវិញពិភពលោក</li>
        <li><b>WLAN (Wireless LAN)</b>: បណ្តាញមូលដ្ឋានដែលមិនប្រើខ្សែ (ប្រើ Wi-Fi) ងាយស្រួលក្នុងការផ្លាស់ទី</li>
        <li><b>VPN (Virtual Private Network)</b>: បណ្តាញឯកជននិម្មិត ដែលបង្កើតឡើងនៅលើបណ្តាញសាធារណៈ ដើម្បីសុវត្ថិភាព</li>
      </ul>
    </li>

    <li>
      <b>Firewall (របាំងការពារ)</b>
      <p>គឺជាឧបករណ៍ (Hardware) ឬកម្មវិធី (Software) សម្រាប់ការពារ និងគ្រប់គ្រងចរាចរណ៍ទិន្នន័យចេញ-ចូល ក្នុងបណ្តាញកុំព្យូទ័រ ដើម្បីទប់ស្កាត់ការវាយប្រហារផ្សេងៗ។</p>
    </li>
  </ol>
  `
}

  <ol>

      <b>ការគោរព (Respect Yourself / Respect Others)</b>
      <ul>
        <li><b>សីលធម៌ឌីជីថល (Digital Etiquette)</b>: ការប្រើប្រាស់ពាក្យសម្តីសមរម្យ មិនជេរប្រមាថ ឬបង្កជម្លោះតាមអនឡាញ (Cyberbullying)।</li>
        <li><b>សិទ្ធិ និងទំនួលខុសត្រូវ (Digital Rights & Responsibilities)</b>: យល់ពីសិទ្ធិសេរីភាពក្នុងការបញ្ចេញមតិ ប៉ុន្តែត្រូវគោរពសិទ្ធិអ្នកដទៃផងដែរ។</li>
        <li><b>ច្បាប់ឌីជីថល (Digital Law)</b>: ការមិនលួចចម្លងស្នាដៃអ្នកដទៃ (Copyright) ឬការ Hack ចូលគណនីគេដែលជាអំពើខុសច្បាប់។</li>
      </ul>
    </li>

    <li>
      <b>ការអប់រំ (Educate Yourself / Connect with Others)</b>
      <ul>
        <li><b>អក្ខរកម្មឌីជីថល (Digital Literacy)</b>: ការរៀនពីរបៀបប្រើឧបករណ៍ (Computer/Phone) និងចេះវាយតម្លៃថាព័ត៌មានណាពិត ព័ត៌មានណាក្លែងក្លាយ (Fake News)។</li>
        <li><b>ការទំនាក់ទំនង (Digital Communication)</b>: ចេះជ្រើសរើសមធ្យោបាយទាក់ទងគ្នាឱ្យចំគោលដៅ (ឧទាហរណ៍៖ ពេលណាត្រូវផ្ញើអ៊ីមែល ពេលណាត្រូវឆាត)។</li>
        <li><b>ការចូលប្រើប្រាស់ (Digital Access)</b>: ការយល់ដឹងថា មិនមែនគ្រប់គ្នាសុទ្ធតែមានអ៊ីនធឺណិតប្រើឡើយ ដូច្នេះយើងត្រូវចេះចែករំលែក និងផ្តល់ឱកាសឱ្យគ្នា។</li>
      </ul>
    </li>

    <li>
      <b>ការការពារ (Protect Yourself / Protect Others)</b>
      <ul>
        <li><b>សន្តិសុខឌីជីថល (Digital Security)</b>: របៀបការពារគណនី (ដូចជាការដាក់ Password ឱ្យខ្លាំង) និងការមិនចុចលើ Link ផ្តេសផ្តាស (Phishing)។</li>
        <li><b>សុខភាពឌីជីថល (Digital Health & Wellness)</b>: ការចេះកំណត់ពេលវេលាប្រើប្រាស់អេក្រង់ (Screen time) ដើម្បីកុំឱ្យប៉ះពាល់ភ្នែក និងសុខភាពផ្លូវចិត្ត។</li>
        <li><b>ពាណិជ្ជកម្មឌីជីថល (Digital Commerce)</b>: ការចេះទិញទំនិញតាមអនឡាញដោយសុវត្ថិភាព និងមិនឱ្យគេបោកប្រាស់។</li>
      </ul>
    </li>
  </ol> `

        <li><b>ការតម្រឹមអត្ថបទ (Alignment)</b>: របៀបដាក់អត្ថបទនៅខាងឆ្វេង កណ្តាល ខាងស្តាំ ឬតម្រឹមឱ្យស្មើឆ្វេងស្តាំ (Justify)។</li>

// Level button click
$(".level-btn").click(function(){
  $(".level-btn").removeClass("active");
  $(this).addClass("active");
  let level = $(this).data("level");
  renderTable(level);
});

// Render table for selected level
function renderTable(level){
  let data = lessonsLevel[level] || [];
  let html = "";

  data.forEach((d,i)=>{
    // ROW មេរៀន
    html += `
      <tr>
        <td>${d.module || ""}</td>
        <td>${d.task || ""}</td>
        <td>
          <input class="form-control form-control-sm"
                 value="${d.title || ""}"
                 onchange="updateValue(${level},${i},'title',this.value)">
        </td>
        <td>
          <input class="form-control form-control-sm text-center"
                 value="${d.page || ""}"
                 onchange="updateValue(${level},${i},'page',this.value)">
        </td>
        <td class="text-center">
          <button class="btn btn-sm btn-info"
          onclick="toggleSummary(${level},${i},this)">
 ​​​        📘 Summary ▼
          </button>
        </td>
      </tr>
      <!-- SUMMARY ROW (បញ្ចូលនៅទីនេះ) -->
      <tr id="summary-${level}-${i}" class="summary-row">
      <td colspan="6">
      <div class="summary-box level-${level}">
  <h4>មេរៀនសង្ខេប</h4>

  <div class="summary-view">
  ${
    localStorage.getItem(getSummaryKey(level,i))
    || d.summary
    || "<ul><li>មិនទាន់មានមេរៀនសង្ខេប</li></ul>"
  }
</div>

  <!-- EDIT MODE -->
  <textarea class="form-control mt-2 summary-edit d-none" rows="5">${
  localStorage.getItem(getSummaryKey(level,i))
  || d.summary
  || ""
}</textarea>

  <div class="mt-2 text-right">
    <button class="btn btn-sm btn-warning"
      onclick="editSummary(this)">✏️ Edit</button>

    <button class="btn btn-sm btn-success d-none"
  onclick="saveSummary(${level},${i},this)">
  💾 Save
</button>
</div>

      </td>
      </tr>
    `;
  });

  $("#lessonTable tbody").html(html);
}
// Diplay and none Sumarize
  function toggleSummary(level,index,btn){
    let row = $("#summary-"+level+"-"+index);

    row.slideToggle(100);

    if($(btn).text().includes("▼")){
      $(btn).text("Summary ▲")
            .removeClass("btn-info")
            .addClass("btn-secondary");
    }else{
      $(btn).text("Summary ▼")
            .removeClass("btn-secondary")
            .addClass("btn-info");
    }
  }

// Update value in lessonsLevel object
function updateValue(level,index,key,value){
  if(lessonsLevel[level] && lessonsLevel[level][index]){
    lessonsLevel[level][index][key] = value;
  }
}
//បង្ហាញ Level 1 ពេលទំព័របើក
$(document).ready(function(){
  $(".level-btn[data-level='1']").addClass("active"); // បង្ហាញ button active
  renderTable(1); // បង្ហាញ table Level 1
});
// Edit summary using Summernote
function editSummary(btn){

  // 🔒 CLOSE all other editors first
  $(".summary-box").each(function(){
    let box = $(this);
    let textarea = box.find(".summary-edit");

    // if summernote is active → destroy
    if(textarea.next('.note-editor').length){
      textarea.summernote('destroy');
    }

    box.find(".summary-edit").addClass("d-none");
    box.find(".summary-view").removeClass("d-none");
    box.find(".btn-success").addClass("d-none");
    box.find(".btn-warning").removeClass("d-none");
  });

  // ✅ OPEN only clicked one
  let box = $(btn).closest(".summary-box");
  let textarea = box.find(".summary-edit");

  box.find(".summary-view").addClass("d-none");
  textarea.removeClass("d-none");
  $(btn).addClass("d-none");
  box.find(".btn-success").removeClass("d-none");

  // ✅ Init Summernote
  textarea.summernote({
    height: 200,
    toolbar: [
      ['style', ['bold','italic','underline','clear']],
      ['font', ['fontname','fontsize']],
      ['para', ['ul','ol','paragraph','align']],
      ['view', ['codeview']]
    ],
    fontNames: ['Tw Cen MT','Khmer OS Battambang','Arial'],
    fontNamesIgnoreCheck: true,
    callbacks:{
      onInit(){
        textarea.summernote('fontName','Khmer OS Battambang');
      }
    }
  });
}

// Save summary
function saveSummary(level,index,btn){
  let box = $(btn).closest(".summary-box");
  let textarea = box.find(".summary-edit");
  let view = box.find(".summary-view");

  // Get HTML from Summernote
  let html = textarea.summernote('code');

  if(!html || html === "<p><br></p>"){
    alert("មិនមានមាតិកាដើម្បីរក្សាទុកទេ");
    return;
  }

  // ✅ Save to localStorage
  localStorage.setItem(getSummaryKey(level,index), html);
  lessonsLevel[level][index].summary = html;

  // ✅ Destroy Summernote editor
  textarea.summernote('destroy');

  // ✅ Switch back to view mode
  view.html(html).removeClass("d-none");
  textarea.addClass("d-none");

  // ✅ Toggle buttons
  box.find(".btn-success").addClass("d-none");
  box.find(".btn-warning").removeClass("d-none");
}
